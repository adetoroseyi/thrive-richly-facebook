name: POD Products (Printify)

# Print-on-demand pipeline: Claude drafts original typography designs (draft mode),
# a human approves them in scripts/pod/design-queue.json, then publish mode renders
# print files and creates + publishes products on the Printify Pop-Up Store.
# MANUAL TRIGGER ONLY.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'draft = generate designs + previews; mockups = create hidden draft products + real mockups; publish = make approved designs live'
        type: choice
        options: [draft, mockups, publish]
        default: draft
      count:
        description: 'How many designs to draft (draft mode only)'
        default: '4'

permissions:
  contents: write

jobs:
  pod:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install fonts + render dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-liberation
          cd scripts/pod && npm install --no-audit --no-fund

      - name: Run POD pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
        run: node scripts/pod/generate-pod.js --mode "${{ inputs.mode }}" --count "${{ inputs.count }}"

      - name: Commit queue, previews and log
        if: always()
        run: |
          git config --local user.email "pod-bot@thriverichly.com"
          git config --local user.name "POD Bot"
          git add -A pod-designs scripts/pod/design-queue.json
          if [ -f scripts/pod/resolved-products.json ]; then git add scripts/pod/resolved-products.json; fi
          if [ -f pod-products-log.jsonl ]; then git add pod-products-log.jsonl; fi
          if ! git diff --cached --quiet; then
            git commit -m "POD: ${{ inputs.mode }} run $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
